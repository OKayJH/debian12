# DLCVCAM: arm systemd-managed hardware watchdog.
# Requires /dev/watchdog (CONFIG_DW_WATCHDOG on RK3576).
# Hard hang -> stop petting -> SoC reset -> U-Boot boot-try can count
# and eventually force recovery. Without this, a hung kernel never
# re-enters U-Boot and boot-try cannot help.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
